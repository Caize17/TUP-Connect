<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1280, initial-scale=1.0"/>
  <title>TUP Konek</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./CSS/navbar.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #FFF4E7;
      font-family: 'Montserrat', sans-serif;
    }

    /*
      Page CSS sets:  body { display:flex; padding-left:132px; overflow:hidden }
      so .main and the right sidebar sit side by side.

      When those stylesheets load into the shell's <head> they hit the
      SHELL's <body>. We lock the shell body here so page CSS can't move it,
      then make #page-content act as the new "body" — giving it the same
      display:flex + padding-left that the pages originally expected.
    */
    html body {
      display:   block   !important;
      padding:   0       !important;
      margin:    0       !important;
      overflow:  hidden  !important;
      height:    100%    !important;
      min-width: 0       !important;
    }

    /* #page-content becomes the flex row the page expects */
    #page-content {
      position:     fixed;
      top: 0; bottom: 0; left: 0; right: 0;
      display:      flex         !important;
      flex-wrap:    nowrap       !important;
      padding-left: 132px        !important;
      overflow:     hidden       !important;
      height:       100vh        !important;
      box-sizing:   border-box   !important;
      background:   #FFF4E7;
      opacity: 1;
      transition: opacity 0.18s ease;
    }

    #page-content.fading {
      opacity: 0;
      pointer-events: none;
    }

    /* campus_directory.css puts margin-left:104px on .main
       — zero it since #page-content padding already handles the gap */
    #page-content .main {
      margin-left: 0 !important;
    }

    #page-loader {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: #4a1010;
      transform: scaleX(0);
      transform-origin: left center;
      z-index: 9999;
      opacity: 0;
    }
    #page-loader.loading {
      opacity: 1;
      transform: scaleX(0.7);
      transition: transform 2s cubic-bezier(0.1, 0.8, 0.2, 1);
    }
    #page-loader.done {
      transform: scaleX(1);
      opacity: 0;
      transition: transform 0.15s ease, opacity 0.3s ease 0.1s;
    }
  </style>
</head>
<body>

  <div id="page-loader"></div>

  <!-- PERSISTENT SIDEBAR — never reloads -->
  <nav class="sidebar" id="nav-pill">
    <a class="sidebar-logo" href="#" id="sidebar-logo-link">
      <img src="./assets/images/logo.png" class="TUP-Konek-logo" alt="TUP Konek">
    </a>

    <div class="sidebar-nav" id="sidebar-nav" style="position:relative;">
      <div class="nav-teardrop" id="nav-teardrop"></div>

      <button class="nav-btn active" data-route="home" title="Home">
        <div class="nav-icon-wrap">
          <img src="./assets/images/community_feed.png" alt="Home">
        </div>
      </button>

      <button class="nav-btn" data-route="campus news" title="Campus News">
        <div class="nav-icon-wrap">
          <img src="./assets/images/campusnews.png" alt="Campus News">
        </div>
      </button>

      <button class="nav-btn" data-route="campus" title="Campus Directory">
        <div class="nav-icon-wrap">
          <img src="./assets/images/campus_directory.png" alt="Campus" style="margin-left:6px;">
        </div>
      </button>

      <div class="nav-spacer"></div>

      <button class="nav-btn-profile" data-route="profile" title="My Profile" id="sidebar-avatar-wrap">
        <div class="nav-profile-avatar" id="nav-profile-avatar">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
      </button>
    </div>
  </nav>

  <!-- PAGE CONTENT — swapped via fetch -->
  <div id="page-content"></div>

  <script src="./JS/shell.js"></script>

</body>
</html>

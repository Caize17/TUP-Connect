<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUP Konek</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../CSS/admin_profile.css">
</head>

<body>

    <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="sidebar-logo">
      <img src="../assets/images/logo.png" class="TUP-Konek-logo">
    </div>

    <div class="sidebar-nav" id="sidebar-nav" style="position:relative;">
      <div class="nav-teardrop" id="nav-teardrop"></div>

      <button class="nav-btn" id="btn-logout" data-index="0" title="Logout">
        <div class="nav-icon-wrap">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </div>
      </button>

      <button class="nav-btn" id="btn-settings" data-index="1" title="Settings">
        <div class="nav-icon-wrap">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
      </button>

      <div class="nav-spacer"></div>

      <button class="nav-btn-profile" data-index="2" data-route="profile" title="My Profile" id="sidebar-avatar-wrap">
        <div class="nav-profile-avatar" id="nav-profile-avatar">
          <img src="../assets/images/anon_avatar.jpg" class="sidebar-avatar-img">
        </div>
      </button>

    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- BANNER -->
    <div class="banner">
      <img src="../assets/images/cover_photo.jpg" class="banner-img">
      <div class="change-photo-wrap">
        <button class="change-photo-btn" onclick="toggleChangePhotoMenu(event)">
          <img src="../assets/images/change_photo.png" class="change-photo-img">
          <span class="change-photo">Change Photo</span>
        </button>
        <div class="change-photo-dropdown" id="changePhotoDropdown">
          <div class="change-photo-item" onclick="document.getElementById('profilePhotoInput').click()">
            <img src="../assets/images/change_profile.png" class="change-photo-item-icon"> Profile Photo
          </div>
          <div class="change-photo-item" onclick="document.getElementById('coverPhotoInput').click()">
            <img src="../assets/images/change_cover.png" class="change-photo-item-icon"> Cover Photo
          </div>
        </div>
      </div>
    </div>

    <!-- HIDDEN FILE INPUTS -->
    <input type="file" id="profilePhotoInput" accept="image/*" style="display: none;">
    <input type="file" id="coverPhotoInput" accept="image/*" style="display: none;">

    <!-- PROFILE -->
    <div class="profile-section">
      <div class="profile-avatar-wrap">
        <div class="profile-avatar">
          <img src="../assets/images/anon_avatar.jpg" class="profile-avatar-inner">
        </div>
      </div>
      <div class="profile-info">
        <div class="profile-name">Puto-Manila Admin</div>
        <div class="profile-email-logo">✉ <span class="profile-email">putomanila.org@tup.edu.ph</span></div>
      </div>
    </div>

    <!-- ════════════════════════════════════════
        PINNED ANNOUNCEMENT
    ════════════════════════════════════════ -->
    <div class="section-label">📌 Pinned Announcement</div>

    <div class="pinned-wrap">
      <div class="card" id="ann-card">
        
        <!-- Push Pin Decoration -->
        <div class="pushpin">
          <div class="pin-head"></div>
          <div class="pin-shaft"></div>
        </div>

        <button class="unpin-post-btn" id="unpin-post-btn" onclick="unpinPost()" title="Unpin Post">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="2" y1="2" x2="22" y2="22"/>
            <line x1="12" y1="17" x2="12" y2="22"/>
            <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17z"/>
          </svg>
          Unpin Post
        </button>

        <!-- Social Reaction Bar -->
        <div class="social-bar-wrap">
          <div class="social-bar-outer">
            <div class="social-bar">
              <span class="social-item" id="btn-likes" title="Like">
                <span id="count-likes"></span>
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              </span>
              <div class="social-divider"></div>
              <span class="social-item" id="btn-thumbsup" title="Thumbs Up">
                <span id="count-thumbsup"></span>
                <svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
              </span>
              <div class="social-divider"></div>
              <span class="social-item" id="btn-reposts" title="Repost">
                <span id="count-reposts"></span>
                <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
              </span>
            </div>
          </div>
        </div>

        <hr class="divider-line"/>
        <div class="timestamp" id="post-timestamp"></div>

        <!-- Card Content -->
        <div class="card-inner">
          
          <!-- Text Bubble -->
          <div class="text-bubble">
            <div class="ann-title" id="post-title"></div>
            <div class="ann-body"  id="post-body"></div>
            <button class="view-more-btn" id="view-more-btn">View more ▾</button>
          </div>

          <!-- Media / Poster -->
          <div class="media-grid" id="media-grid">
            <div class="poster-hint">
              <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
            </div>
            <div id="poster-card-inner">
              <div class="p-header">
                <div class="p-logo">
                  <svg viewBox="0 0 24 24" fill="none" stroke="#8b1a1a" stroke-width="2">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                  </svg>
                </div>
                <div class="p-org" id="poster-org"></div>
              </div>
              <div class="p-deco"></div>
              <div class="p-body">
                <div class="p-headline" id="poster-headline"></div>
                <div class="p-sub-box"><div class="p-sub-text" id="poster-subtext"></div></div>
                <div class="p-date"    id="poster-date"></div>
                <div class="p-desc"    id="poster-desc"></div>
                <div id="poster-colleges"></div>
              </div>
              <div class="p-deco-btm"></div>
              <div class="p-footer">
                <div class="p-footer-icons">
                  <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
                  <svg viewBox="0 0 24 24"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/></svg>
                  <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
                </div>
                <div class="p-footer-mid">TUP USG MANILA</div>
                <div class="p-footer-right" id="poster-handle"></div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- POST INPUT -->
    <div class="post-input-wrap">
      <img src="../assets/images/anon_avatar.jpg" class="post-input-img">
      <input class="post-input-field"
        placeholder="Hi ka-Puto! What's the news?"
        onclick="openPostModal()"
        readonly>
      <button type="button" class="post-input-icon" id="btn-add-photo" title="Add Photo">
        <img src="../assets/images/add photo.png" alt="Add Photo">
      </button>
    </div>

    <!-- FEED -->
    <div class="feed" id="feed"></div>

  </main>

  <template id="post-template">
    <div class="feed-reactions">
      <button class="feed-reaction-btn" data-type="like">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span class="reaction-likes-count">0</span> Heart
      </button>
      <button class="feed-reaction-btn" data-type="comment">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="reaction-comments-count">0</span> Comment
      </button>
      <button class="feed-reaction-btn" data-type="repost">
        <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        <span class="reaction-reposts-count">0</span> Repost
      </button>
    </div>
  </template>

  <!-- POST MENU TEMPLATE (edit menu items here) -->
  <template id="menu-template">
    <div class="dropdown-item" onclick="editPost(event)"> 
      <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Edit Post
    </div>
    <div class="dropdown-item" onclick="pinPost(event)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;flex-shrink:0;">
        <line x1="12" y1="17" x2="12" y2="22"/>
        <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17z"/>
      </svg> Pin Post
    </div>
    <div class="dropdown-item danger" onclick="deletePost(event)">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg> Delete
    </div>
  </template>

  <!-- POST MODAL -->
  <div class="modal-overlay" id="postModal" onclick="closeModalOnOverlay(event)">
    <div class="modal">

      <div class="modal-header">
        <div class="modal-title">Create post</div>
        <button class="modal-close-btn" onclick="closePostModal()">✕</button>
      </div>

      <div class="modal-body">
        <div class="modal-user-row">

          <!-- ✅ id="modal-avatar" added — wrapping div so JS can swap img or svg inside -->
          <div id="modal-avatar" class="modal-user-avatar">
            <img src="../assets/images/anon_avatar.jpg" alt="Me" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
          </div>

          <div class="modal-user-info">
            <!-- ✅ id="modal-user-name" added -->
            <div class="modal-user-name" id="modal-user-name">Puto-Manila Organization</div>
          </div>
        </div>

        <textarea class="modal-textarea" id="postContent" placeholder="Hi ka-Puto! What's the news?"></textarea>
        <div class="modal-attachments" id="modal-attachments"></div>
        <div class="modal-footer">
          <button class="modal-add-photo-btn">
            <img src="../assets/images/add_photo.png" alt="Add Photo" style="width:68px;height:52px;object-fit:contain;margin-right:-18px;"/>
            Add Photo
          </button>
          <input type="file" id="modal-file-input" accept="image/*" multiple/>
          <button class="modal-submit-btn" id="modal-submit-btn" onclick="submitPost()" disabled aria-label="Post">
              <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>

    </div>
  </div>

    <!-- COMMENT MODAL -->
    <div class="comment-modal-overlay" id="commentModal" onclick="closeCommentModalOnOverlay(event)">

        <div class="comment-modal">

            <div class="comment-modal-header">
                <div class="comment-modal-title">Add a comment</div>
                <button class="comment-modal-close" onclick="closeCommentModal()">✕</button>
            </div>

            <div class="comment-modal-list" id="commentModalList"></div>

            <div class="comment-modal-input-row">

                <div class="comment-modal-avatar">
                    <img src="../assets/images/anon_avatar.jpg" alt="You"
                        onerror="this.style.display='none'; this.parentElement.innerHTML='👩';">
                </div>

                <div class="comment-modal-bubble-input">

                    <input
                        class="comment-modal-input"
                        id="commentModalInput"
                        placeholder="Share your thoughts..."
                        onkeydown="handleModalCommentKey(event)">
                </div>

                <button class="comment-modal-submit" onclick="submitModalComment()">
                    <img src="../assets/images/post.png" alt="post">
                </button>

            </div>

        </div>

    </div>

     <!-- REPOST MODAL -->
  <div class="modal-overlay" id="repostModal" onclick="closeRepostModalOnOverlay(event)">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Repost</div>
        <button class="modal-close-btn" onclick="closeRepostModal()">✕</button>
      </div>
      <div class="modal-body">
        <textarea class="modal-textarea" id="repostContent" placeholder="Add a quote (optional)..."></textarea>
        <div class="modal-footer">
          <div class="repost-send-button-container">
            <button class="modal-submit-btn" id="repost-submit-btn" onclick="submitRepost()">
              <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- REPOST VIEW MODAL -->
  <div class="comment-modal-overlay" id="repostViewModal" onclick="closeRepostViewModalOnOverlay(event)">
    <div class="comment-modal">
      <div class="comment-modal-header">
        <div class="comment-modal-title">Reposts</div>
        <button class="comment-modal-close" onclick="closeRepostViewModal()">✕</button>
      </div>
      <div class="comment-modal-list" id="repostViewModalList"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <div id="lightbox">
    <span id="lightbox-close">&#x2715;</span>
    <img id="lightbox-img" src="" alt="Full view"/>
  </div>

  <script src="../JS/admin_profile.js"></script>

</body>
</html>

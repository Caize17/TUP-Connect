<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TUP Konek – Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --maroon:    #6b1111;
      --maroon-dk: #4a0c0c;
      --maroon-lt: #8b2020;
      --cream:     #f5efe3;
      --cream-dk:  #ece4d4;
      --cream-md:  #e8dfc8;
      --white:     #fdfaf4;
      --text:      #2a1a0a;
      --muted:     #8a7a6a;
      --gold:      #c8a84b;
      --right-w:   240px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--cream);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ════════════════════════════════════════
       LEFT SIDEBAR
    ════════════════════════════════════════ */
    .sidebar {
      width: 118px;
      height: 100vh;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 0 24px;
      position: sticky;
      top: 0;
      z-index: 10;
      gap: 0;
    }

    .sidebar-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin-bottom: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .logo-img {
      margin-left: 12px;
      width: 118px;
      height: auto;
      display: block;
    }
    .logo-text-fallback {
      font-family: 'Montserrat', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: var(--maroon-dk);
      line-height: 1;
      text-align: center;
    }
    .logo-text-fallback em { font-style: italic; color: var(--maroon); }

    .nav-pill {
      background: var(--maroon-dk);
      border-radius: 999px;
      width: 86px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 0 18px;
      gap: 4px;
      box-shadow: none;
      flex-shrink: 0;
      overflow: visible;
      position: relative;
      z-index: 2;
      min-height: 72vh;
    }

    .nav-spacer { flex: 1; min-height: 28px; }

    .nav-item {
      width: 52px; height: 52px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      position: relative; background: transparent;
      border-radius: 50%; z-index: 4;
      transition: background .18s;
    }
    .nav-icon {
      width: 76px; height: 54px;
      object-fit: contain; flex-shrink: 0;
      position: relative; z-index: 4;
      filter: brightness(0) invert(1) opacity(0.45);
      transition: filter .18s, transform .18s;
    }
    .nav-item:not(.active):hover { background: rgba(255,255,255,.1); }
    .nav-item:not(.active):hover .nav-icon {
      filter: brightness(0) invert(1) opacity(0.85);
      transform: scale(1.12);
    }
    .nav-item.active .nav-icon {
      filter: brightness(0) saturate(100%) invert(11%) sepia(60%) saturate(800%) hue-rotate(320deg) brightness(80%);
    }

    .nav-teardrop {
      position: absolute; left: 10px; top: 0;
      width: 96px; height: 52px;
      background: var(--cream);
      clip-path: path('M26 0 C11 0, 0 11, 0 26 C0 41, 11 52, 26 52 C38 52, 78 38, 92 26 C78 14, 38 0, 26 0 Z');
      transition: top .35s cubic-bezier(.65,0,.35,1);
      z-index: 1; pointer-events: none;
    }

    .nav-avatar {
      width: 50px; height: 50px; border-radius: 50%;
      object-fit: cover; cursor: pointer; display: block;
      border: 2.5px solid rgba(255,255,255,.25);
      transition: border-color .18s, transform .18s; flex-shrink: 0;
    }
    .nav-avatar:hover { border-color: rgba(255,255,255,.7); transform: scale(1.05); }
    .nav-avatar-placeholder {
      width: 50px; height: 50px; border-radius: 50%; overflow: hidden;
      cursor: pointer; border: 2.5px solid rgba(255,255,255,.22);
      flex-shrink: 0; transition: border-color .18s, transform .18s;
      background: rgba(255,255,255,.12);
      display: flex; align-items: center; justify-content: center;
    }
    .nav-avatar-placeholder:hover { border-color: rgba(255,255,255,.6); transform: scale(1.05); }
    .nav-avatar-placeholder svg { width: 26px; height: 26px; fill: rgba(255,255,255,.6); }

    /* ════════════════════════════════════════
       MAIN FEED
    ════════════════════════════════════════ */
    .main {
      flex: 1; min-width: 0; height: 100vh;
      overflow-y: auto; padding: 28px 28px 40px;
      display: flex; flex-direction: column; gap: 32px;
      scrollbar-width: thin; scrollbar-color: var(--cream-md) transparent;
    }
    .main::-webkit-scrollbar { width: 5px; }
    .main::-webkit-scrollbar-thumb { background: var(--cream-md); border-radius: 4px; }

    .section-label {
      font-size: 11px; font-weight: 800; letter-spacing: .1em;
      color: var(--muted); text-transform: uppercase; margin-bottom: -10px;
    }

    /* ════════════════════════════════════════
       PINNED ANNOUNCEMENT CARD
    ════════════════════════════════════════ */
    .pinned-wrap { display: flex; justify-content: center; padding-top: 38px; position: relative; }

    .card {
      position: relative; background: var(--white);
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(0,0,0,.13), 0 2px 8px rgba(0,0,0,.08);
      width: 100%; padding: 10px 16px 14px;
      border: 1.5px solid var(--cream-md);
    }

    .pushpin { position: absolute; top: -16px; left: 28px; width: 38px; height: 38px; z-index: 10; }
    .pushpin .pin-head {
      width: 28px; height: 28px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff6666, #c0392b 60%, #7b1a1a);
      box-shadow: 0 3px 8px rgba(0,0,0,.35), inset 0 -2px 4px rgba(0,0,0,.2);
      position: absolute; top: 0; left: 5px;
    }
    .pushpin .pin-head::after {
      content:''; width:8px; height:8px; border-radius:50%;
      background:rgba(255,255,255,.45); position:absolute; top:5px; left:5px;
    }
    .pushpin .pin-shaft {
      width:4px; height:14px; background:linear-gradient(to bottom,#aaa,#777);
      position:absolute; top:22px; left:17px; border-radius:0 0 3px 3px;
    }

    /* Social trapezoid bar */
    .social-bar-wrap {
      display: flex; justify-content: center;
      margin-bottom: 10px; margin-top: -40px;
      position: relative; z-index: 5;
    }
    .social-bar-outer {
      clip-path: polygon(6% 0%, 94% 0%, 100% 100%, 0% 100%);
      border-radius: 0 0 18px 18px; overflow: hidden;
      box-shadow: 0 4px 16px rgba(80,10,10,.35), 0 2px 6px rgba(0,0,0,.2);
      min-width: 320px;
    }
    .social-bar {
      display: flex; align-items: center; gap: 28px;
      background: #5a1010; border-radius: 0 0 18px 18px;
      padding: 18px 44px;
    }
    .social-item {
      display: flex; align-items: center; gap: 6px;
      font-weight: 600; font-size: 15px; color: #f5e8c8;
      cursor: pointer; user-select: none;
      transition: opacity .15s; white-space: nowrap;
    }
    .social-item:hover { opacity: .72; }
    .social-item svg {
      width: 18px; height: 18px; stroke: #f5e8c8; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
    }
    .social-divider { width: 1.5px; height: 18px; background: rgba(245,232,200,.22); border-radius: 2px; }

    .divider-line { border: none; border-top: 1.5px solid var(--cream-md); margin-bottom: 8px; }
    .timestamp { text-align: center; font-size: 11px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }

    .card-inner { display: flex; gap: 14px; align-items: flex-start; }

    .text-bubble {
      flex: 1; min-width: 0; background: #fff;
      border: 1.5px solid #ddd6c8; border-radius: 14px;
      padding: 10px 11px; position: relative;
    }
    .text-bubble::after {
      content:''; position:absolute; right:-12px; top:16px;
      border-width:8px 0 8px 13px; border-style:solid;
      border-color:transparent transparent transparent #ddd6c8;
    }
    .text-bubble::before {
      content:''; position:absolute; right:-10px; top:17px;
      border-width:7px 0 7px 12px; border-style:solid;
      border-color:transparent transparent transparent #fff; z-index:1;
    }
    .ann-title {
      font-size: 11.5px; font-weight: 900; color: #1a1a1a;
      margin-bottom: 6px; text-align: center; letter-spacing: .01em;
    }
    .ann-body {
      font-size: 10.5px; color: #2a2a2a; font-weight: 700;
      line-height: 1.5; text-align: center;
    }
    .ann-body p { margin-bottom: 4px; }
    .ann-body p:last-child { margin-bottom: 0; }
    /* Clamped state — JS toggles this class */
    .ann-body.is-clamped {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    /* View more / less button */
    .view-more-btn {
      background: none; border: none;
      color: var(--maroon); font-family: 'Montserrat', sans-serif;
      font-size: 10.5px; font-weight: 800; cursor: pointer;
      padding: 4px 0 0; display: none;
      width: 100%; text-align: center; transition: opacity .15s;
    }
    .view-more-btn:hover { opacity: .7; }
    .view-more-btn.visible { display: block; }

    /* Media grid */
    .media-grid {
      flex-shrink: 0; width: 150px; height: 150px;
      transform: rotate(1.5deg); cursor: pointer;
      position: relative; border-radius: 10px; overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
    }
    .media-grid:hover .poster-hint { opacity: 1; }
    .poster-hint {
      position: absolute; inset: 0; background: rgba(0,0,0,.3);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .2s; z-index: 3; pointer-events: none;
    }
    .poster-hint svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .img-grid { display: grid; gap: 2px; width: 100%; }
    .img-grid.count-1 { grid-template-columns: 1fr; grid-template-rows: 150px; }
    .img-grid.count-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 150px; }
    .img-grid.count-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 74px 74px; }
    .img-grid.count-3 .gi:first-child { grid-row: 1 / 3; }
    .img-grid.count-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 74px 74px; }
    .gi { overflow: hidden; position: relative; }
    .gi img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gi-more { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; font-weight: 900; }

    /* Built-in poster card */
    #poster-card-inner { width: 100%; border-radius: 10px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,.22); }
    .p-header { background: #6b1a1a; padding: 6px 9px; display: flex; align-items: center; gap: 7px; }
    .p-logo { width: 26px; height: 26px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .p-logo svg { width: 16px; height: 16px; }
    .p-org { color: #fff; font-size: 10px; font-weight: 900; letter-spacing: .05em; }
    .p-deco { height: 24px; background: repeating-linear-gradient(45deg,#c8a84b 0,#c8a84b 7px,#8b1a1a 7px,#8b1a1a 14px); opacity: .85; }
    .p-body { background: #f5ede0; padding: 9px; }
    .p-headline { font-family: 'Montserrat', sans-serif; font-size: 20px; font-weight: 700; color: #8b1a1a; letter-spacing: .04em; line-height: 1; margin-bottom: 5px; }
    .p-sub-box { background: #8b1a1a; border-left: 4px solid #c8a84b; padding: 5px 7px; margin-bottom: 7px; border-radius: 0 4px 4px 0; }
    .p-sub-text { font-size: 7.5px; font-weight: 800; color: #fff; line-height: 1.4; text-transform: uppercase; letter-spacing: .03em; }
    .p-date { font-size: 6.5px; font-weight: 800; color: #8b1a1a; letter-spacing: .07em; text-transform: uppercase; margin-bottom: 5px; }
    .p-desc { font-size: 7.5px; font-weight: 800; color: #2a1a0a; line-height: 1.5; text-transform: uppercase; letter-spacing: .02em; margin-bottom: 8px; }
    .p-college { background: #f5ede0; border: 2px solid #8b1a1a; border-radius: 4px; padding: 4px 7px; margin-bottom: 4px; font-size: 7.5px; font-weight: 900; color: #8b1a1a; text-align: center; letter-spacing: .04em; text-transform: uppercase; }
    .p-college:last-child { margin-bottom: 0; }
    .p-deco-btm { height: 18px; background: repeating-linear-gradient(45deg,#c8a84b 0,#c8a84b 7px,#8b1a1a 7px,#8b1a1a 14px); opacity: .85; }
    .p-footer { background: #6b1a1a; padding: 5px 9px; display: flex; justify-content: space-between; align-items: center; }
    .p-footer-icons { display: flex; gap: 5px; }
    .p-footer-icons svg { width: 9px; height: 9px; fill: #c8a84b; }
    .p-footer-mid { font-size: 6.5px; font-weight: 800; color: #c8a84b; letter-spacing: .04em; }
    .p-footer-right { font-size: 6px; font-weight: 800; color: #fff; }

    /* ════════════════════════════════════════
       CREATE POST BAR
    ════════════════════════════════════════ */
    .comment-bar {
      background: rgb(222, 194, 198, 0.50);
      border-radius: 14px; padding: 12px 16px;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      cursor: pointer; transition: background .18s;
    }
    .comment-bar:hover { background: rgb(222, 194, 198, 0.70); }
    .comment-avatar-ph {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--maroon);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-right: -6px; overflow: hidden; pointer-events: none;
    }
    .comment-avatar-ph svg { width: 20px; height: 20px; stroke: var(--cream); fill: none; stroke-width: 2; }
    .comment-avatar-ph img { width: 100%; height: 100%; object-fit: cover; }
    .comment-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex-shrink: 0; margin-right: -6px; pointer-events: none; }
    .comment-input {
      margin-left: 12px; margin-right: 12px; flex: 1;
      background: rgb(183, 157, 161, 0.75); border: none; border-radius: 50px;
      padding: 12px 20px; font-family: 'Montserrat', sans-serif; font-size: 14px;
      color: rgb(150, 120, 125); pointer-events: none;
    }
    .comment-send {
      background: transparent; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.15s;
      flex-shrink: 0; margin-left: -10px; padding: 6px;
      border-radius: 8px; width: 44px; height: 44px; overflow: visible;
    }
    .comment-send:hover { background: rgba(107,26,26,0.18); }
    .comment-send img { width: 78px; height: 56px; object-fit: contain; pointer-events: none; }

    /* ════════════════════════════════════════
       CREATE POST MODAL
    ════════════════════════════════════════ */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 1000;
      align-items: center; justify-content: center;
      backdrop-filter: blur(2px);
    }
    .modal-overlay.open { display: flex; }

    .create-post-modal {
      background: var(--cream); border-radius: 24px;
      width: 92vw; max-width: 640px;
      max-height: 88vh;
      box-shadow: 0 24px 64px rgba(0,0,0,.3);
      overflow: hidden;
      animation: modalIn .25s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(.92) translateY(16px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Header — cream bg, centered title, X top-right */
    .modal-header {
      background: var(--cream);
      padding: 22px 28px 14px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      border-bottom: 1.5px solid var(--cream-md);
    }
    .modal-header-title {
      font-size: 20px; font-weight: 800;
      color: var(--maroon-dk); letter-spacing: .01em;
    }
    .modal-close {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      background: rgb(222, 194, 198, 0.6); border: none; border-radius: 50%;
      width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--maroon-dk); font-size: 16px; font-weight: 700;
      line-height: 1; transition: background .15s;
    }
    .modal-close:hover { background: rgb(222, 194, 198, 1); }

    .modal-body { padding: 20px 28px 24px; }

    /* User row: avatar + name + anonymous toggle */
    .modal-user-row { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .modal-avatar-ph {
      width: 54px; height: 54px; border-radius: 50%;
      background: var(--maroon); display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; overflow: hidden; border: 2px solid var(--cream-md);
    }
    .modal-avatar-ph svg { width: 22px; height: 22px; stroke: var(--cream); fill: none; stroke-width: 2; }
    .modal-avatar-ph img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .modal-user-info { flex: 1; }
    .modal-user-name { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 4px; }

    /* Anonymous toggle row */
    .modal-anon-row {
      display: flex; align-items: center; gap: 8px;
    }
    .modal-anon-label {
      font-size: 11px; font-weight: 600; color: var(--muted);
    }
    /* Toggle switch */
    .toggle-wrap {
      position: relative; width: 40px; height: 22px; flex-shrink: 0;
    }
    .toggle-wrap input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: var(--cream-md); border-radius: 999px;
      cursor: pointer; transition: background .2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute;
      width: 16px; height: 16px; border-radius: 50%;
      background: #fff; top: 3px; left: 3px;
      transition: transform .2s;
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }
    .toggle-wrap input:checked + .toggle-slider { background: var(--maroon); }
    .toggle-wrap input:checked + .toggle-slider::before { transform: translateX(18px); }

    /* Textarea */
    .modal-textarea {
      width: 100%; min-height: 200px;
      background: rgb(222, 194, 198, 0.25);
      border: none; border-radius: 14px; padding: 16px 18px;
      font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 700;
      color: var(--text); resize: none; outline: none;
    }
    .modal-textarea::placeholder { color: rgb(150, 120, 125); font-weight: 500; }

    /* Attachment previews */
    .modal-attachments { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .modal-attach-thumb {
      width: 64px; height: 64px; border-radius: 8px;
      object-fit: cover; border: 2px solid var(--cream-md); cursor: pointer;
    }
    .modal-attach-thumb:hover { opacity: .75; }

    /* Bottom action bar: Add Photo left, Send right */
    .modal-actions {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 14px;
      margin-left: -4px;
    }
    .modal-photo-btn {
      display: flex; align-items: center; gap: 2px;
      background: none; border: none; cursor: pointer;
      font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700;
      color: var(--text); padding: 6px 0;
      transition: opacity .15s;
    }
    .modal-photo-btn:hover { opacity: .7; }
    .modal-photo-icon {
      width: 38px; height: 38px;
      background: var(--cream-md); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .modal-photo-icon svg { width: 20px; height: 20px; stroke: var(--text); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    #modal-file-input { display: none; }

    /* Send button — circle arrow like reference */
    .modal-submit {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--maroon-dk); border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s, opacity .15s;
      flex-shrink: 0;
    }
    .modal-submit:hover { background: var(--maroon); }
    .modal-submit:disabled { opacity: .35; cursor: not-allowed; }
    .modal-submit svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    /* ════════════════════════════════════════
       FEED POST CARD
    ════════════════════════════════════════ */
    .feed-post {
      background: var(--white);
      border: 1.5px solid var(--cream-md);
      border-radius: 18px;
      padding: 16px 18px 0;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      overflow: hidden;
    }

    /* Header row */
    .feed-post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .feed-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--cream-md); flex-shrink: 0; }
    .feed-avatar-ph { width: 42px; height: 42px; border-radius: 50%; background: var(--maroon-lt); display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
    .feed-avatar-ph svg { width: 20px; height: 20px; stroke: var(--cream); fill: none; stroke-width: 2; }
    .feed-avatar-ph img { width: 100%; height: 100%; object-fit: cover; }
    .feed-meta { flex: 1; }
    .feed-name { font-size: 13px; font-weight: 800; color: var(--text); line-height: 1.2; }

<!-- ══════════════════════════════════════════════════
     SCRIPT
     🔥 Firebase team: swap static data reads for
        Firestore listeners and Auth state handlers.
══════════════════════════════════════════════════ -->
<script>
(function () {

  /* ── Logo ── */
  if (USER.logoSrc) {
    document.getElementById('sidebar-logo-inner').outerHTML =
      `<img class="logo-img" src="${USER.logoSrc}" alt="TUP Konek logo"/>`;
  }

  /* ── User data (🔥 replace with auth.onAuthStateChanged) ── */
  document.getElementById('profile-name').textContent    = USER.name     || '—';
  document.getElementById('profile-email').textContent   = USER.email    || '—';
  document.getElementById('profile-id').textContent      = USER.studentId|| '—';
  document.getElementById('modal-user-name').textContent = USER.name     || 'Guest';

  if (USER.photoSrc) {
    document.getElementById('profile-photo-wrap').innerHTML =
      `<img class="profile-photo" src="${USER.photoSrc}" alt="Profile photo"/>`;
    document.getElementById('sidebar-avatar-wrap').outerHTML =
      `<img class="nav-avatar" id="sidebar-avatar-wrap" src="${USER.photoSrc}" alt="Me" title="My Profile"/>`;
    document.getElementById('comment-avatar-wrap').outerHTML =
      `<img class="comment-avatar" id="comment-avatar-wrap" src="${USER.photoSrc}" alt="Me"/>`;
    document.getElementById('modal-avatar').innerHTML =
      `<img src="${USER.photoSrc}" alt="Me" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
  }

  /* ── Announcement (🔥 replace with Firestore onSnapshot) ── */
  function fmt(n) { return n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,'')+'k' : n; }

  /* Find the pinned announcement card wrapper to swap with empty state if needed */
  const pinnedCardEl = document.querySelector('.card-inner')?.closest('.main > *:nth-child(2)') || null;

  if (POST) {
    document.getElementById('count-likes').textContent    = fmt(POST.likes);
    document.getElementById('count-thumbsup').textContent = fmt(POST.thumbsUp);
    document.getElementById('count-reposts').textContent  = fmt(POST.reposts);
    document.getElementById('post-timestamp').textContent = POST.timestamp;
    document.getElementById('post-title').textContent     = POST.title;
    document.getElementById('post-body').innerHTML        = POST.body.map(p=>`<p>${p}</p>`).join('');
    document.getElementById('poster-org').textContent      = POST.posterOrg;
    document.getElementById('poster-headline').textContent = POST.posterHeadline;
    document.getElementById('poster-subtext').textContent  = POST.posterSubtext;
    document.getElementById('poster-date').textContent     = POST.posterDate;
    document.getElementById('poster-desc').textContent     = POST.posterDesc;
    document.getElementById('poster-handle').textContent   = POST.posterHandle + ' ✉';
    document.getElementById('poster-colleges').innerHTML   =
      POST.posterColleges.map(c=>`<div class="p-college">${c}</div>`).join('');
  } else {
    /* No pinned announcement — show empty state in place of the whole card */
    const annCard = document.getElementById('ann-card');
    if (annCard) {
      annCard.innerHTML = `
        <div class="pinned-empty">
          <svg viewBox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0 1 18 14.158V11a6 6 0 0 0-5-5.917V4a1 1 0 1 0-2 0v1.083A6 6 0 0 0 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 1 1-6 0v-1m6 0H9"/></svg>
          <div class="pinned-empty-text">No announcements yet</div>
        </div>`;
    }
  }

  /* ── View More / View Less ── */
  if (POST) {
    (function () {
      const body = document.getElementById('post-body');
      const btn  = document.getElementById('view-more-btn');
      let expanded = false;
      body.classList.add('is-clamped');
      requestAnimationFrame(() => {
        if (body.scrollHeight > body.clientHeight) {
          btn.classList.add('visible');
        } else {
          body.classList.remove('is-clamped');
        }
      });
      btn.addEventListener('click', function () {
        expanded = !expanded;
        body.classList.toggle('is-clamped', !expanded);
        btn.textContent = expanded ? 'View less ▴' : 'View more ▾';
      });
    })();

    /* ── Media grid (🔥 POST.images → Storage URLs) ── */
    const mediaGrid = document.getElementById('media-grid');
    const imgs = POST.images || [];
    if (imgs.length > 0) {
      document.getElementById('poster-card-inner').style.display = 'none';
      const shown    = Math.min(imgs.length, 4);
      const extra    = imgs.length - shown;
      const countCls = imgs.length===1?'count-1':imgs.length===2?'count-2':imgs.length===3?'count-3':'count-4';
      const cells = imgs.slice(0,shown).map((src,i) => {
        const isLast = i===shown-1 && extra>0;
        return `<div class="gi"><img src="${src}" alt="post image"/>${isLast?`<div class="gi-more">+${extra+1}</div>`:''}</div>`;
      }).join('');
      const grid = document.createElement('div');
      grid.className = `img-grid ${countCls}`;
      grid.innerHTML = cells;
      mediaGrid.insertBefore(grid, mediaGrid.querySelector('.poster-hint').nextSibling);
    }
  }

  /* ── Feed posts (🔥 replace with Firestore onSnapshot) ── */
  function renderFeedPosts() {
    if (FEED_POSTS.length === 0) {
      document.getElementById('feed-posts').innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <div class="empty-state-title">No posts yet</div>
          <div class="empty-state-sub">Be the first one to share something with your fellow TUPians!</div>
        </div>`;
      return;
    }
    document.getElementById('feed-posts').innerHTML = FEED_POSTS.map((fp, idx) => {
      const avatarHtml = fp.repost
        ? (fp.photoSrc
            ? `<img class="feed-avatar" src="${fp.photoSrc}" alt="${fp.name}"/>`
            : `<div class="feed-avatar-ph"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>`)
        : (fp.photoSrc
            ? `<img class="feed-avatar" src="${fp.photoSrc}" alt="${fp.name}"/>`
            : `<div class="feed-avatar-ph"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>`);

      const headerMeta = fp.repost
        ? `<div class="feed-meta">
            <div class="feed-name">
              <svg viewBox="0 0 24 24" style="width:12px;height:12px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;margin-right:3px;"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
              ${fp.name} <span style="font-weight:600;color:var(--muted);">reposted</span>
            </div>
            <div class="feed-time">${fp.time}</div>
           </div>`
        : `<div class="feed-meta">
            <div class="feed-name">${fp.name}</div>
            <div class="feed-time">${fp.time}</div>
           </div>`;

      const quoteHtml = fp.quote ? `
        <div class="feed-quote">
          <div class="feed-quote-header">
            ${fp.quote.photoSrc
              ? `<div class="feed-quote-avatar"><img src="${fp.quote.photoSrc}" alt="${fp.quote.name}"/></div>`
              : `<div class="feed-quote-avatar"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>`}
            <span class="feed-quote-name">${fp.quote.name}</span>
          </div>
          <div class="feed-quote-body">${fp.quote.body.replace(/\n/g,'<br>')}</div>
        </div>` : '';

      const bodyHtml = fp.body ? `
        <div class="feed-body" id="feed-body-${idx}">${fp.body}</div>
        <button class="feed-view-more" id="feed-vm-${idx}">View more ▾</button>` : '';

      const firstComment = fp.commentList && fp.commentList.length > 0 ? fp.commentList[0] : null;
      const commentPreviewHtml = (fp.comments > 0 && firstComment) ? `
        <div class="feed-comments-section">
          <button class="feed-view-comments" data-post="${idx}">View more comments</button>
          <div class="feed-comment-preview">
            <div class="feed-comment-avatar">
              ${firstComment.photoSrc
                ? `<img src="${firstComment.photoSrc}" alt="${firstComment.name}"/>`
                : `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`}
            </div>
            <div class="feed-comment-bubble">
              <div class="feed-comment-name">${firstComment.name}</div>
              <div class="feed-comment-text">${firstComment.text}</div>
            </div>
          </div>
        </div>` : '';

      return `
      <div class="feed-post">
        <div class="feed-post-header">
          ${avatarHtml}
          ${headerMeta}
        </div>
        ${bodyHtml}
        ${quoteHtml}
        <div class="feed-reactions">
          <button class="feed-reaction-btn" data-post="${idx}" data-type="like">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            ${fmt(fp.likes)} Heart
          </button>
          <button class="feed-reaction-btn" data-post="${idx}" data-type="comment">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            ${fp.comments} Comment
          </button>
          <button class="feed-reaction-btn" data-post="${idx}" data-type="repost">
            <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            ${fp.reposts} Repost
          </button>
        </div>
        ${commentPreviewHtml}
      </div>`;
    }).join('');

    /* View more per post */
    FEED_POSTS.forEach((fp, idx) => {
      if (!fp.body) return;
      const bodyEl = document.getElementById(`feed-body-${idx}`);
      const vmBtn  = document.getElementById(`feed-vm-${idx}`);
      if (!bodyEl || !vmBtn) return;
      let expanded = false;
      bodyEl.classList.add('is-clamped');
      requestAnimationFrame(() => {
        if (bodyEl.scrollHeight > bodyEl.clientHeight) {
          vmBtn.classList.add('visible');
        } else {
          bodyEl.classList.remove('is-clamped');
        }
      });
      vmBtn.addEventListener('click', () => {
        expanded = !expanded;
        bodyEl.classList.toggle('is-clamped', !expanded);
        vmBtn.textContent = expanded ? 'View less ▴' : 'View more ▾';
      });
    });

    /* View-more-comments links */
    document.querySelectorAll('.feed-view-comments').forEach(btn => {
      btn.addEventListener('click', () => openCommentModal(parseInt(btn.dataset.post)));
    });

    /* Reaction button clicks — 🔥 Firebase: toggle in Firestore */
    document.querySelectorAll('.feed-reaction-btn').forEach(btn => {
      btn.addEventListener('click', function (e) {
        const type = this.dataset.type;

        if (type === 'like') {
          const isActive = this.classList.toggle('heart-active');
          const svg = this.querySelector('svg');

          /* Re-trigger animation by removing and re-adding class */
          svg.style.animation = 'none';
          svg.offsetHeight; /* reflow */
          svg.style.animation = '';

          /* Particle burst */
          if (isActive) {
            const rect = this.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const angles = [0, 45, 90, 135, 180, 225, 270, 315];
            angles.forEach(angle => {
              const p = document.createElement('div');
              p.className = 'heart-burst';
              const rad = angle * Math.PI / 180;
              const dist = 28 + Math.random() * 14;
              p.style.setProperty('--dx', `${Math.cos(rad)*dist}px`);
              p.style.setProperty('--dy', `${Math.sin(rad)*dist}px`);
              p.style.left = `${cx - 3}px`;
              p.style.top  = `${cy - 3}px`;
              p.style.position = 'fixed';
              document.body.appendChild(p);
              setTimeout(() => p.remove(), 600);
            });
          }
          /* TODO Firebase team: toggle heart in Firestore */

        } else if (type === 'comment') {
          openCommentModal(parseInt(this.dataset.post));

        } else if (type === 'repost') {
          const isActive = this.classList.toggle('repost-active');
          const svg = this.querySelector('svg');
          const label = this.lastChild;

          /* Re-trigger spin */
          svg.style.animation = 'none';
          svg.offsetHeight;
          svg.style.animation = '';

          /* Toggle label text */
          const postIdx = parseInt(this.dataset.post);
          const base = FEED_POSTS[postIdx].reposts;
          if (isActive) {
            label.textContent = ` Reposted`;
            showToast('You Reposted!');
          } else {
            label.textContent = ` ${fmt(base)} Repost`;
          }
          /* TODO Firebase team: toggle repost in Firestore */
        }
      });
    });
  }
  renderFeedPosts();

  /* ── Lightbox ── */
  const lightbox = document.getElementById('lightbox');
  const lbImg    = document.getElementById('lightbox-img');
  const openLB   = src => { lbImg.src=src; lightbox.classList.add('open'); };
  const closeLB  = ()  => { lightbox.classList.remove('open'); lbImg.src=''; };
  const mediaGridEl = document.getElementById('media-grid');
  if (mediaGridEl) {
    mediaGridEl.addEventListener('click', () => {
      if (POST && POST.images && POST.images.length > 0) openLB(POST.images[0]);
    });
  }
  document.getElementById('lightbox-close').addEventListener('click', closeLB);
  lightbox.addEventListener('click', e=>{ if(e.target===lightbox) closeLB(); });

  /* ── Toast ── */
  let toastTimer = null;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
  }

  /* ── Comment Modal ── */
  const commentOverlay = document.getElementById('comment-modal-overlay');
  const commentList    = document.getElementById('comment-list');

  function avatarHtmlFor(photoSrc, name) {
    return photoSrc
      ? `<img src="${photoSrc}" alt="${name}"/>`
      : `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
  }

  function openCommentModal(postIdx) {
    const fp = FEED_POSTS[postIdx];
    commentList.innerHTML = (fp.commentList || []).map(c => `
      <div class="comment-item">
        <div class="comment-item-avatar">${avatarHtmlFor(c.photoSrc, c.name)}</div>
        <div class="comment-item-content">
          <div class="comment-item-bubble">
            <div class="comment-item-name">${c.name}</div>
            <div class="comment-item-text">${c.text}</div>
          </div>
          <div class="comment-item-time">${c.time}</div>
        </div>
      </div>`).join('');

    /* Set current user avatar in input row */
    const inputAvatar = document.getElementById('comment-input-avatar');
    inputAvatar.innerHTML = USER.photoSrc
      ? `<img src="${USER.photoSrc}" alt="Me" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
      : `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;

    commentOverlay.dataset.post = postIdx;
    commentOverlay.classList.add('open');
    setTimeout(() => document.getElementById('comment-input-field').focus(), 150);
  }

  function closeCommentModal() { commentOverlay.classList.remove('open'); }

  document.getElementById('comment-modal-close').addEventListener('click', closeCommentModal);
  commentOverlay.addEventListener('click', e => { if (e.target === commentOverlay) closeCommentModal(); });

  /* Send comment — 🔥 Firebase team: addDoc to comments subcollection */
  document.getElementById('comment-send-btn').addEventListener('click', () => {
    console.log('Comment — wire to Firebase');
  });

  /* ── Create Post Modal ── */
  const overlay    = document.getElementById('create-post-overlay');
  const textarea   = document.getElementById('post-textarea');
  const submitBtn  = document.getElementById('modal-submit-btn');
  const attachWrap = document.getElementById('modal-attachments');
  const fileInput  = document.getElementById('modal-file-input');
  const anonToggle = document.getElementById('modal-anon-toggle');

  function openModal()  { overlay.classList.add('open'); setTimeout(()=>textarea.focus(),100); }
  function closeModal() { overlay.classList.remove('open'); }

  document.getElementById('open-create-post').addEventListener('click', openModal);
  document.getElementById('btn-add-photo').addEventListener('click', e => {
    e.stopPropagation(); openModal(); setTimeout(()=>fileInput.click(),150);
  });
  document.getElementById('modal-close-btn').addEventListener('click', closeModal);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

  /* Enable/disable Post button based on textarea content */
  textarea.addEventListener('input', function () {
    submitBtn.disabled = this.value.trim().length === 0;
    /* 🔥 Firebase: optional draft auto-save here */
  });

  /* Anonymous toggle — 🔥 Firebase: if checked, post as anonymous */
  anonToggle.addEventListener('change', function () {
    const nameEl   = document.getElementById('modal-user-name');
    const avatarEl = document.getElementById('modal-avatar');
    if (this.checked) {
      nameEl.textContent = 'Anonymous Puto';
      avatarEl.innerHTML = `<img src="../assets/images/anon_avatar.jpg" alt="Anonymous" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
    } else {
      nameEl.textContent = USER.name;
      avatarEl.innerHTML = USER.photoSrc
        ? `<img src="${USER.photoSrc}" alt="Me" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
        : `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
    }
  });

  /* Photo preview (🔥 Firebase: replace with Storage.uploadBytes()) */
  document.getElementById('modal-photo-btn').addEventListener('click', ()=>fileInput.click());
  fileInput.addEventListener('change', function () {
    Array.from(this.files).forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        const thumb = document.createElement('img');
        thumb.src = e.target.result;
        thumb.className = 'modal-attach-thumb';
        thumb.title = 'Click to remove';
        thumb.addEventListener('click', ()=>thumb.remove());
        attachWrap.appendChild(thumb);
      };
      reader.readAsDataURL(file);
    });
  });

  /* Submit (🔥 Firebase: addDoc(collection(db,'posts'), { body, images, isAnonymous, authorUid, createdAt })) */
  submitBtn.addEventListener('click', function () {
    const text = textarea.value.trim();
    if (!text) return;
    const isAnon = anonToggle.checked;
    /* TODO Firebase team: write post to Firestore here */
    console.log('Post submitted:', { text, isAnonymous: isAnon });
    textarea.value = ''; attachWrap.innerHTML = '';
    anonToggle.checked = false;
    document.getElementById('modal-user-name').textContent = USER.name;
    document.getElementById('modal-avatar').innerHTML = USER.photoSrc
      ? `<img src="${USER.photoSrc}" alt="Me" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
      : `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
    submitBtn.disabled = true;
    closeModal();
    showToast('Post Shared!');
  });

  /* Quick actions */
  document.getElementById('btn-settings').addEventListener('click', ()=>{
    /* TODO: navigate to settings page */
    console.log('Settings');
  });
  document.getElementById('btn-logout').addEventListener('click', ()=>{
    /* 🔥 Firebase: auth.signOut() */
    console.log('Logout — wire to firebase auth.signOut()');
  });

  /* Social reactions (🔥 Firebase: Firestore toggle + onSnapshot live count) */
  document.getElementById('btn-likes')?.addEventListener('click',    ()=>{ /* TODO */ });
  document.getElementById('btn-thumbsup')?.addEventListener('click', ()=>{ /* TODO */ });
  document.getElementById('btn-reposts')?.addEventListener('click',  ()=>{ /* TODO */ });

  /* ── Keyboard shortcuts ── */
  document.addEventListener('keydown', e=>{
    if (e.key==='Escape') { closeLB(); closeModal(); }
  });

  /* ── Sliding teardrop nav ── */
  (function () {
    const pill     = document.getElementById('nav-pill');
    const teardrop = document.getElementById('nav-teardrop');
    const items    = Array.from(pill.querySelectorAll('.nav-item'));

    function moveTo(item) {
      const pillRect = pill.getBoundingClientRect();
      const itemRect = item.getBoundingClientRect();
      const centerY  = itemRect.top + itemRect.height/2 - pillRect.top;
      teardrop.style.top = (centerY-26)+'px';
    }

    items.forEach(item => {
      item.addEventListener('click', function () {
        items.forEach(i=>i.classList.remove('active'));
        this.classList.add('active');
        moveTo(this);
        /* 🔥 Firebase: use data-route for SPA routing */
        console.log('Navigate to:', this.dataset.route);
      });
    });

    const active = pill.querySelector('.nav-item.active');
    if (active) {
      teardrop.style.transition = 'none';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        moveTo(active);
        teardrop.style.transition='';
      }));
    }
  })();

})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1280, initial-scale=1.0"/>
  <title>TUP Konek – Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../CSS/homepage.css"/>
  <link rel="stylesheet" href="../CSS/navbar.css"/>
  <link rel="stylesheet" href="../CSS/guest.css"/>

  <script type="importmap">
  {
    "imports": {
      "@google/generative-ai": "https://esm.run/@google/generative-ai"
    }
  }
</script>
</head>
<body>

<!-- ════════════════════════════════════════
     LEFT SIDEBAR
════════════════════════════════════════ -->
<nav class="sidebar" id="nav-pill">
  <a class="sidebar-logo" href="#" id="sidebar-logo-link">
    <div class="logo-text-fallback" id="sidebar-logo-inner"></div>
  </a>

  <div class="sidebar-nav" id="sidebar-nav" style="position:relative;">
    <div class="nav-teardrop" id="nav-teardrop"></div>

    <button class="nav-btn active" data-index="0" data-route="home" title="Home">
      <div class="nav-icon-wrap">
        <img src="../assets/images/community_feed.png" alt="Home">
      </div>
    </button>

    <button class="nav-btn" data-index="2" data-route="campus news" title="Campus News">
      <div class="nav-icon-wrap">
        <img src="../assets/images/campusnews.png" alt="Campus News">
      </div>
    </button>

    <button class="nav-btn" data-index="3" data-route="campus" title="Campus">
      <div class="nav-icon-wrap">
        <img src="../assets/images/campus_directory.png" alt="Campus" style="margin-left:6px;">
      </div>
    </button>

    <div class="nav-spacer"></div>

    <button class="nav-btn-profile" data-index="4" data-route="profile" title="My Profile" id="sidebar-avatar-wrap">
      <div class="nav-profile-avatar" id="nav-profile-avatar">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
    </button>
  </div>
</nav>

<!-- ════════════════════════════════════════
     MAIN FEED
════════════════════════════════════════ -->
<main class="main">

  <div class="section-label">📌 Pinned Announcement</div>

  <div class="pinned-wrap">
    <div class="card" id="ann-card">
      <div class="pushpin">
        <div class="pin-head"></div>
        <div class="pin-shaft"></div>
      </div>

      <div class="social-bar-wrap">
        <div class="social-bar-outer">
          <div class="social-bar">
            <span class="social-item" id="btn-likes" title="Like">
              <span id="count-likes"></span>
              <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </span>
            <div class="social-divider"></div>
            <span class="social-item" id="btn-thumbsup" title="Thumbs Up">
              <span id="count-thumbsup"></span>
              <svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
            </span>
            <div class="social-divider"></div>
            <span class="social-item" id="btn-reposts" title="Repost">
              <span id="count-reposts"></span>
              <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            </span>
          </div>
        </div>
      </div>

      <hr class="divider-line"/>
      <div class="timestamp" id="post-timestamp"></div>

      <div class="card-inner">
        <div class="text-bubble">
          <div class="ann-title" id="post-title"></div>
          <div class="ann-body"  id="post-body"></div>
          <button class="view-more-btn" id="view-more-btn">View more ▾</button>
        </div>

        <div class="media-grid" id="media-grid">
          <div class="poster-hint">
            <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
          </div>
          <div id="poster-card-inner">
            <div class="p-header">
              <div class="p-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="#8b1a1a" stroke-width="2">
                  <circle cx="12" cy="12" r="4"/>
                  <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
                </svg>
              </div>
              <div class="p-org" id="poster-org"></div>
            </div>
            <div class="p-deco"></div>
            <div class="p-body">
              <div class="p-headline" id="poster-headline"></div>
              <div class="p-sub-box"><div class="p-sub-text" id="poster-subtext"></div></div>
              <div class="p-date"    id="poster-date"></div>
              <div class="p-desc"    id="poster-desc"></div>
              <div id="poster-colleges"></div>
            </div>
            <div class="p-deco-btm"></div>
            <div class="p-footer">
              <div class="p-footer-icons">
                <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
                <svg viewBox="0 0 24 24"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/></svg>
                <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
              </div>
              <div class="p-footer-mid">TUP USG MANILA</div>
              <div class="p-footer-right" id="poster-handle"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Create post bar -->
  <div class="comment-bar" id="open-create-post" role="button" aria-label="Create a post">
    <div class="comment-avatar-ph" id="comment-avatar-wrap">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </div>
    <div class="comment-input">Hi ka-Puto! What's the news?</div>
    <button class="comment-send" id="btn-add-photo" title="Add Photo">
      <img src="../assets/images/add_photo.png" alt="Add Photo"/>
    </button>
  </div>

  <div id="feed-posts"></div>

</main>

<!-- ════════════════════════════════════════
     RIGHT PANEL
════════════════════════════════════════ -->
<aside class="right-panel">

  <div class="profile-card">
    <div class="profile-card-top">
      <div class="profile-name"  id="profile-name"></div>
      <div class="profile-email" id="profile-email"></div>
    </div>
    <hr class="profile-divider"/>
    <div class="profile-photo-wrap">
      <div class="profile-photo-ph" id="profile-photo-wrap">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
    </div>
    <div class="profile-id" id="profile-id"></div>
  </div>

  <div class="quick-card">
    <div class="quick-title">Quick Actions</div>
    <button class="quick-btn" id="btn-settings">
      <span class="quick-btn-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </span>
      <span class="quick-btn-label">Settings</span>
      <span class="quick-btn-arrow">→</span>
    </button>
    <button class="quick-btn" id="btn-logout">
      <span class="quick-btn-icon">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </span>
      <span class="quick-btn-label">Logout</span>
    </button>
  </div>

</aside>

<!-- ════════════════════════════════════════
     CREATE POST MODAL
════════════════════════════════════════ -->
<div class="modal-overlay" id="create-post-overlay">
  <div class="create-post-modal" id="create-post-modal" role="dialog" aria-modal="true" aria-label="Create a post">
    <div class="modal-header">
      <span class="modal-header-title">Create post</span>
      <button class="modal-close" id="modal-close-btn" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-user-row">
        <div class="modal-avatar-ph" id="modal-avatar">
          <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="modal-user-info">
          <div class="modal-user-name" id="modal-user-name"></div>
          <div class="modal-anon-row">
            <span class="modal-anon-label">Post Anonymously</span>
            <label class="toggle-wrap">
              <input type="checkbox" id="modal-anon-toggle"/>
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
      </div>
      <textarea class="modal-textarea" id="post-textarea" placeholder="Hi ka-Puto! What's the news?" maxlength="1000"></textarea>
      <div class="modal-attachments" id="modal-attachments"></div>
      <div class="modal-actions">
        <button class="modal-photo-btn" id="modal-photo-btn" title="Add photo">
          <img src="../assets/images/add_photo.png" alt="Add Photo" style="width:68px;height:52px;object-fit:contain;margin-right:-18px;"/>
          Add Photo
        </button>
        <input type="file" id="modal-file-input" accept="image/*" multiple/>
        <button class="modal-submit" id="modal-submit-btn" disabled aria-label="Post">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════
     COMMENT MODAL
════════════════════════════════════════ -->
<div class="comment-modal-overlay" id="comment-modal-overlay">
  <div class="comment-modal" id="comment-modal">
    <div class="comment-modal-header">
      <span class="comment-modal-title">Comments</span>
      <button class="comment-modal-close" id="comment-modal-close">✕</button>
    </div>
    <div class="comment-list" id="comment-list"></div>
    <div class="comment-input-row">
      <div class="comment-input-avatar" id="comment-input-avatar">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="comment-input-wrap">
        <input class="comment-input-field" id="comment-input-field" placeholder="Share your thoughts..." maxlength="500"/>
        <button class="comment-send-btn" id="comment-send-btn">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Toast & Lightbox -->
<div id="toast"></div>

<div id="lightbox">
  <span id="lightbox-close">&#x2715;</span>
  <img id="lightbox-img" src="" alt="Full view"/>
</div>

<!-- REPOST MODAL -->
<div class="modal-overlay" id="repostModal" onclick="closeRepostModalOnOverlay(event)">
  <div class="create-post-modal" style="height: auto; min-height: 0;">
    <div class="modal-header">
      <span class="modal-header-title">Repost</span>
      <button class="modal-close" onclick="closeRepostModal()">✕</button>
    </div>
    <div class="modal-body">
      <textarea class="modal-textarea" id="repostContent" placeholder="Add a quote (optional)..."></textarea>
      <div class="modal-actions" style="justify-content: flex-end;">
        <button class="modal-submit" id="repost-submit-btn" onclick="submitRepost()">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Shared navbar -->
<script src="../JS/navbar.js"></script>
<!-- External JS (must come after DATA script above) -->
<script type="module" src="../JS/post.js"></script>
<script type="module" src="../JS/comments.js"></script>
<script type="module" src="../JS/homepage.js"></script>
<script type="module" src="../JS/homepage_rightbar.js"></script>

<!-- ASK ME - fixed, outside feed -->
    <div class="ask-me-wrap" onclick="toggleChat()">
      <img src="../assets/images/Tupee.png" class="ask-me-img">
    </div>

    <!-- Chat Modal -->
    <div class="chat-modal" id="chatModal">
      <!-- Header -->
      <div class="chat-header">
        <div class="chat-header-info">
          <img src="../assets/images/Tupee_logo.png" class="chat-avatar">
          <span>TUPee AI</span>
        </div>
        <button class="chat-close" onclick="toggleChat()">✕</button>
      </div>

      <!-- Body -->
      <div class="chat-body" id="chatBody">
        <!-- Bot intro with avatar -->
        <div class="bot-row">
          <img src="../assets/images/Tupee_logo.png" class="bot-row-avatar">
          <div class="bot-message">
            Helloo, It's Tupee! ^.^ Need help? Spill mo lang, I got you.
          </div>
        </div>

        <!-- Suggestion buttons (no avatar) -->
        <div class="suggestions">
          <button class="suggestion-btn" onclick="askSuggestion('Office hours of TUP')">
            <svg viewBox="0 0 24 24">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M22 12C22 17.5228 17.5228 22 12 22C6.47715 
              22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12ZM12 7.75C11.3787 7.75 10.875 
              8.25368 10.875 8.875C10.875 9.28921 10.5392 9.625 10.125 9.625C9.71079 9.625 9.375 9.28921 9.375 8.875C9.375 
              7.42525 10.5503 6.25 12 6.25C13.4497 6.25 14.625 7.42525 14.625 8.875C14.625 9.58584 14.3415 10.232 13.883 
              10.704C13.7907 10.7989 13.7027 10.8869 13.6187 10.9708C13.4029 11.1864 13.2138 11.3753 13.0479 11.5885C12.8289 
              11.8699 12.75 12.0768 12.75 12.25V13C12.75 13.4142 12.4142 13.75 12 13.75C11.5858 13.75 11.25 13.4142 11.25 
              13V12.25C11.25 11.5948 11.555 11.0644 11.8642 10.6672C12.0929 10.3733 12.3804 10.0863 12.6138 9.85346C12.6842 9.78321 
              12.7496 9.71789 12.807 9.65877C13.0046 9.45543 13.125 9.18004 13.125 8.875C13.125 8.25368 12.6213 7.75 12 7.75ZM12 
              17C12.5523 17 13 16.5523 13 16C13 15.4477 12.5523 15 12 15C11.4477 15 11 15.4477 11 16C11 16.5523 11.4477 17 12 17Z" 
              fill="currentColor"></path></svg>
            Office hours of TUP
          </button>
          <button class="suggestion-btn" onclick="askSuggestion('What is the mission of TUP?')">
            <svg viewBox="0 0 24 24">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M22 12C22 17.5228 17.5228 22 12 22C6.47715 
              22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12ZM12 7.75C11.3787 7.75 10.875 
              8.25368 10.875 8.875C10.875 9.28921 10.5392 9.625 10.125 9.625C9.71079 9.625 9.375 9.28921 9.375 8.875C9.375 
              7.42525 10.5503 6.25 12 6.25C13.4497 6.25 14.625 7.42525 14.625 8.875C14.625 9.58584 14.3415 10.232 13.883 
              10.704C13.7907 10.7989 13.7027 10.8869 13.6187 10.9708C13.4029 11.1864 13.2138 11.3753 13.0479 11.5885C12.8289 
              11.8699 12.75 12.0768 12.75 12.25V13C12.75 13.4142 12.4142 13.75 12 13.75C11.5858 13.75 11.25 13.4142 11.25 
              13V12.25C11.25 11.5948 11.555 11.0644 11.8642 10.6672C12.0929 10.3733 12.3804 10.0863 12.6138 9.85346C12.6842 9.78321 
              12.7496 9.71789 12.807 9.65877C13.0046 9.45543 13.125 9.18004 13.125 8.875C13.125 8.25368 12.6213 7.75 12 7.75ZM12 
              17C12.5523 17 13 16.5523 13 16C13 15.4477 12.5523 15 12 15C11.4477 15 11 15.4477 11 16C11 16.5523 11.4477 17 12 17Z" 
              fill="currentColor"></path></svg>
              What is the mission of TUP?
          </button>
        </div>
      </div>

      <!-- Input -->
      <div class="chat-input">
        <input type="text" id="userInput" placeholder="Type your message..." 
              onkeypress="if(event.key==='Enter') sendMessage()"/>
        <button onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>

  <script src="../JS/guest.js"></script>
</body>
</html>
